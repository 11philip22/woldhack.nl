<svg xmlns="http://www.w3.org/2000/svg" width="860" height="410" viewBox="0 0 860 410" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative LiteScope capture of a command timeout</title>
  <desc id="desc">The PHY acknowledgement signal ulpi_nxt stays low. The test changes from ST_WAIT_COMMAND, value 3, to ST_FAIL, value 11, when the error code becomes 1. That error triggers the capture, which includes samples before and after the failure. Only a few samples are shown.</desc>
  <style>
    :root {
      --bg: #0d0d0a; --text: #e8e6dc; --line: #c8c6bc; --grid: #49493f;
      --accent: #f97316; --ack: #70d6ff; --state: #9fda7f;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f5f4ee; --text: #111110; --line: #2a2a22; --grid: #b0ada3;
        --accent: #c2410c; --ack: #0f6ea6; --state: #2f7d34;
      }
    }
    text { font-family: Arial, sans-serif; fill: var(--text); font-size: 16px; }
    .signal { font-family: Consolas, monospace; font-size: 16px; }
    .muted { fill: var(--line); font-size: 15px; }
    .grid { stroke: var(--grid); stroke-width: 1; stroke-dasharray: 4 5; }
    .wave { fill: none; stroke-width: 2.5; stroke-linejoin: round; }
  </style>
  <rect width="860" height="410" rx="6" fill="var(--bg)"/>
  <text x="24" y="32" style="fill:var(--accent)">Capture of a command timeout</text>
  <text class="muted" x="836" y="32" text-anchor="end">Illustrative · 60 MHz</text>

  <rect x="200" y="52" width="336" height="30" fill="var(--line)" opacity="0.08"/>
  <rect x="538" y="52" width="298" height="30" fill="var(--accent)" opacity="0.12"/>
  <text class="muted" x="368" y="73" text-anchor="middle">Before trigger</text>
  <text class="muted" x="687" y="73" text-anchor="middle">After trigger</text>

  <path class="grid" d="M 236 112 V 343 M 336 112 V 343 M 436 112 V 343 M 636 112 V 343 M 736 112 V 343 M 836 112 V 343"/>
  <path d="M 536 83 V 343" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="548" y="103" style="fill:var(--accent);font-size:14px">Trigger: error = 1</text>

  <text class="signal" x="24" y="141">ulpi_nxt</text>
  <path class="wave" stroke="var(--ack)" d="M 200 154 H 836"/>
  <text class="muted" x="216" y="140">0 — no acknowledgement</text>

  <text class="signal" x="24" y="224">debug_state</text>
  <path class="wave" stroke="var(--state)" d="M 200 200 H 530 L 542 236 H 836 M 200 236 H 530 L 542 200 H 836"/>
  <text x="365" y="224" text-anchor="middle">ST_WAIT_COMMAND (3)</text>
  <text x="689" y="224" text-anchor="middle">ST_FAIL (11)</text>

  <text class="signal" x="24" y="309">debug_error_code</text>
  <path class="wave" stroke="var(--accent)" d="M 200 322 H 536 V 288 H 836"/>
  <text class="muted" x="216" y="309">0</text>
  <text class="muted" x="558" y="312">1</text>

  <text x="200" y="374">The capture keeps the wait and the failure in view.</text>
  <text class="muted" x="836" y="392" text-anchor="end">Time →</text>
</svg>
